name: Personal creative skills

on:
  pull_request:
    paths:
      - 'writing/writer-compiler/**'
      - 'writing/creative-production/**'
      - '.github/workflows/personal-creative-skills.yml'
  push:
    branches: [master, 'feat/personal-creative-production']
    paths:
      - 'writing/writer-compiler/**'
      - 'writing/creative-production/**'
      - '.github/workflows/personal-creative-skills.yml'

permissions:
  contents: read

concurrency:
  group: personal-creative-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test production contracts
        run: python -m unittest discover -s writing/creative-production/scripts/tests -v
      - name: Validate writing example
        run: python writing/creative-production/scripts/validate_project.py writing/creative-production/templates/writing-project.json
      - name: Validate screen example
        run: python writing/creative-production/scripts/validate_project.py writing/creative-production/templates/screen-project.json
